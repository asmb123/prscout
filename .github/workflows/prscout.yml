name: PRScout Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR event JSON
        run: |
          cat > pr.json <<EOF
          {
            "repository": {
              "full_name": "${{ github.repository }}"
            },
            "pull_request": {
              "number": ${{ github.event.pull_request.number }}
            }
          }
          EOF

      - name: Pull PRScout image
        run: docker pull asmb3456/prscout:latest

      - name: Run PRScout
        env:
          PRSCOUT_GITHUB_TOKEN: ${{ secrets.PRSCOUT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL || 'openai/gpt-oss-20b' }}
        run: |
          docker run --rm \
            --entrypoint sh \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e PRSCOUT_GITHUB_TOKEN \
            -e GITHUB_TOKEN \
            -e GROQ_API_KEY \
            -e GROQ_MODEL \
            -e GROQ_FALLBACK_MODEL \
            -e GITHUB_EVENT_PATH=/workspace/pr.json \
            asmb3456/prscout:latest \
            -c 'uv run app/cli.py --event ./pr.json'
