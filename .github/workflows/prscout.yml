
name: PRScout Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR event JSON
        run: |
          cat <<EOF > pr.json
          {
            "repository": {
              "full_name": "${{ github.repository }}"
            },
            "pull_request": {
              "number": ${{ github.event.pull_request.number }}
            }
          }
          EOF

      - name: Pull PRScout Docker image
        run: docker pull asmb3456/prscout:latest

      - name: Run PRScout
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            -e GROQ_MODEL="${{ vars.GROQ_MODEL }}" \
            -e GROQ_FALLBACK_MODEL="${{ vars.GROQ_FALLBACK_MODEL }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            asmb3456/prscout:latest \
            sh -c '
              apt-get update &&
              apt-get install -y curl &&
              curl -LsSf https://astral.sh/uv/install.sh | sh &&
              export PATH="/root/.local/bin:$PATH" &&
              uv sync &&
              uv run app/cli.py --event ./pr.json
            '
